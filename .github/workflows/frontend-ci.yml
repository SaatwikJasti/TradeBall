name: Frontend CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:frontend
      - run: npm run build
        env:
          VITE_API_BASE: https://tradeball-backend.onrender.com/api/v1
