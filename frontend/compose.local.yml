services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tradeball_react
      POSTGRES_USER: tradeball
      POSTGRES_PASSWORD: tradeball
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - react_local_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeball -d tradeball_react"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  react_local_pg:
